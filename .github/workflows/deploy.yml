name: Deploy

# Manual-only: this deploys over SSH using DEPLOY_HOST / DEPLOY_KEY secrets.
# Until those are configured (and a server exists), running on every push just
# fails. Trigger it from the Actions tab ("Run workflow") once secrets are set.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/aegisai
            git pull
            docker compose up -d --build