[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=app --cov-report=term-missing --cov-report=xml
filterwarnings =
    # Third-party deprecation surfaced by Starlette's TestClient (httpx backend).
    # Matched by message across categories so it's silenced regardless of the
    # installed Starlette version. Our own warnings stay visible.
    ignore:Using .httpx. with .starlette.testclient. is deprecated
